<!DOCTYPE html>


<h2>Mini Test</h2>
<form id="miniTest"></form>
<p id="miniResult"></p>
</div>


<a href="index.html" class="btn return">Return Home</a>


<script>
const miniQs = [
{q:"They have lots of pictures _____ their fridge.", options:["in","on"], correct:1},
{q:"We put the old books _____ a box.", options:["at","in"], correct:1},
{q:"I just called him _____ work.", options:["at","on"], correct:0},
{q:"I don't like to study _____ home.", options:["at","in"], correct:0},
{q:"We stayed in a cabin _____ a lake.", options:["in","on"], correct:1},
{q:"My office is _____ the 20th floor.", options:["in","on"], correct:1},
{q:"I like to listen to music when I'm _____ the gym.", options:["at","on"], correct:0},
{q:"There are Roman ruins _____ Jordan.", options:["at","in"], correct:1}
];


const miniForm=document.getElementById('miniTest');
miniQs.forEach((item,i)=>{
const div=document.createElement('div');
div.className='question-box';
div.innerHTML=`<p>${item.q}</p>` + item.options.map((opt,j)=>`<label><input type='radio' name='m${i}' value='${j}'> ${opt}</label><br>`).join('');
miniForm.appendChild(div);
});


const btn=document.createElement('button');
btn.textContent='Submit';
btn.className='btn';
btn.type='button';
miniForm.appendChild(btn);


btn.onclick=()=>{
let score=0;
miniQs.forEach((item,i)=>{
const ans=document.querySelector(`input[name='m${i}']:checked`);
if(ans && Number(ans.value)===item.correct) score++;
});
document.getElementById('miniResult').textContent = `Good job! 🎉 You did really well. Click below to return home and continue learning.`;
};
</script>
</body>
</html>
